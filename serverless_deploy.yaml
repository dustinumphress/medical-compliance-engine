AWSTemplateFormatVersion: '2010-09-09'
Description: "Deploy Medical Audit Engine on Lambda (Serverless) with Bedrock Access"

# Note: long-form intrinsics (Fn::Ref/Fn::GetAtt) are used instead of !Ref/!GetAtt
# so the pre-commit check-yaml hook can parse this file.

Parameters:
  ImageUri:
    Type: String
    Description: "The URI of the Docker image in ECR"
  FunctionUrlAuthType:
    Type: String
    Description: "AWS_IAM requires SigV4-signed requests; NONE makes the demo publicly reachable (anyone can invoke it and spend Bedrock tokens)."
    Default: AWS_IAM
    AllowedValues:
      - AWS_IAM
      - NONE

Conditions:
  IsPublic:
    Fn::Equals:
      - Ref: FunctionUrlAuthType
      - "NONE"

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInvokeOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  # Anthropic foundation models only — not the full Bedrock surface
                  - arn:aws:bedrock:*::foundation-model/anthropic.*
                  - Fn::Sub: "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*.anthropic.*"

  AuditFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: MedicalAuditDemo
      PackageType: Image
      Code:
        ImageUri:
          Ref: ImageUri
      Role:
        Fn::GetAtt: [LambdaExecutionRole, Arn]
      Timeout: 120
      MemorySize: 2048
      Architectures:
        - x86_64
      Environment:
        Variables:
          DEMO_MODE: "True"
          LLM_PROVIDER: "bedrock"
          BEDROCK_MODEL_ID: "anthropic.claude-sonnet-5"

  AuditFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn:
        Ref: AuditFunction
      AuthType:
        Ref: FunctionUrlAuthType
      Cors:
        AllowOrigins:
          - "*"
        AllowMethods:
          - "POST"

  # Only created when the URL is deliberately deployed public
  PublicAccessPermission:
    Type: AWS::Lambda::Permission
    Condition: IsPublic
    Properties:
      FunctionName:
        Ref: AuditFunction
      Principal: "*"
      Action: lambda:InvokeFunctionUrl
      FunctionUrlAuthType: NONE

Outputs:
  DemoUrl:
    Description: "The URL for your Medical Audit Demo"
    Value:
      Fn::GetAtt: [AuditFunctionUrl, FunctionUrl]
